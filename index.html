<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bridge34 Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', 'Apple SD Gothic Neo', sans-serif;
      background: #0c0c1a;
      color: #e0e0f0;
      min-height: 100vh;
      padding: 28px 32px 60px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
    }

    .header-title {
      font-size: 2rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.5px;
    }

    .header-title span { color: #ff6633; }

    .header-right {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .clock {
      font-size: 1.8rem;
      font-weight: 300;
      color: #8888bb;
      font-variant-numeric: tabular-nums;
    }

    /* 날짜 영역 */
    .date-section {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #14142a;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .date-nav {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .date-btn {
      background: #1a1a2e;
      border: none;
      color: #aaa;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1.2rem;
      transition: all 0.2s;
    }

    .date-btn:hover {
      background: #22223a;
      color: #fff;
    }

    .date-display {
      font-size: 1.1rem;
      font-weight: 600;
      color: #fff;
      min-width: 200px;
    }

    .date-icon {
      font-size: 1.3rem;
    }

    /* Kanban */
    .kanban-wrap {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .kanban-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: #fff;
    }

    .add-task-btn {
      background: #ff6633;
      border: none;
      color: #fff;
      padding: 10px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .add-task-btn:hover {
      background: #ff8844;
      transform: translateY(-2px);
    }

    .kanban {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .column {
      background: #14142a;
      border-radius: 16px;
      padding: 20px;
      min-height: 500px;
    }

    .column-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #aaa;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #2a2a3a;
    }

    .task-card {
      background: #1a1a2e;
      border-left: 3px solid #666;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
      cursor: grab;
      transition: all 0.2s;
    }

    .task-card.high { border-left-color: #ff4444; }
    .task-card.mid { border-left-color: #ffaa00; }

    .task-card:hover {
      background: #22223a;
      transform: translateY(-2px);
    }

    .task-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 8px;
    }

    .task-title {
      font-weight: 600;
      color: #fff;
      flex: 1;
    }

    .task-close {
      color: #888;
      cursor: pointer;
      font-size: 1.2rem;
      padding: 0 4px;
    }

    .task-close:hover { color: #ff6633; }

    .task-meta {
      font-size: 0.85rem;
      color: #888;
      display: flex;
      gap: 8px;
    }

    .task-client {
      background: #2a2a3a;
      padding: 2px 8px;
      border-radius: 4px;
    }

    .task-due { color: #ff9933; }
    .task-assignee {
      font-size: 0.8rem;
      color: #6699ff;
      margin-top: 6px;
    }

    /* Schedules 섹션 */
    .schedules-section {
      background: #14142a;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .schedules-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .schedules-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .schedule-item {
      display: flex;
      align-items: center;
      gap: 16px;
      background: #1a1a2e;
      padding: 12px 14px;
      border-radius: 8px;
      border-left: 3px solid #6699ff;
    }

    .schedule-time {
      font-weight: 600;
      color: #6699ff;
      min-width: 50px;
    }

    .schedule-title {
      flex: 1;
      color: #fff;
    }

    .schedule-link {
      background: #ff6633;
      color: #fff;
      padding: 4px 12px;
      border-radius: 4px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s;
    }

    .schedule-link:hover {
      background: #ff8844;
    }

    .schedule-empty {
      color: #666;
      padding: 20px;
      text-align: center;
    }

    /* Clients Table */
    .clients-section {
      margin-top: 20px;
    }

    .clients-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 16px;
      color: #fff;
    }

    .clients-table {
      width: 100%;
      border-collapse: collapse;
      background: #14142a;
      border-radius: 8px;
      overflow: hidden;
    }

    .clients-table thead {
      background: #1a1a2e;
    }

    .clients-table th {
      padding: 14px;
      text-align: left;
      font-weight: 600;
      color: #aaa;
      border-bottom: 1px solid #2a2a3a;
    }

    .clients-table td {
      padding: 12px 14px;
      border-bottom: 1px solid #2a2a3a;
      color: #ccc;
    }

    .clients-table tr:hover {
      background: #1a1a2e;
    }

    .risk-green { color: #44dd88; font-weight: 600; }
    .risk-yellow { color: #ffaa00; font-weight: 600; }
    .risk-red { color: #ff4444; font-weight: 600; }
    .risk-grey { color: #888; }

    .close-btn {
      color: #888;
      cursor: pointer;
      font-size: 1.1rem;
    }

    .close-btn:hover { color: #ff6633; }

    /* Task 추가 모달 */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal.show { display: flex; }

    .modal-content {
      background: #14142a;
      border-radius: 12px;
      padding: 24px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }

    .modal-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 16px;
      color: #fff;
    }

    .modal-group {
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
    }

    .modal-label {
      font-size: 0.9rem;
      font-weight: 600;
      color: #aaa;
      margin-bottom: 6px;
    }

    .modal input, .modal select {
      background: #1a1a2e;
      border: 1px solid #2a2a3a;
      color: #fff;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 1rem;
      transition: all 0.2s;
    }

    .modal input:focus, .modal select:focus {
      outline: none;
      border-color: #ff6633;
      background: #22223a;
    }

    .modal-buttons {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    .modal-btn {
      flex: 1;
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .modal-btn.submit {
      background: #ff6633;
      color: #fff;
    }

    .modal-btn.submit:hover {
      background: #ff8844;
    }

    .modal-btn.cancel {
      background: #2a2a3a;
      color: #aaa;
    }

    .modal-btn.cancel:hover {
      background: #3a3a4a;
    }

    @media (max-width: 1400px) {
      .kanban { grid-template-columns: 1fr; }
      .clients-table { font-size: 0.9rem; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1 class="header-title"><span>Bridge34</span> Dashboard</h1>
    <div class="header-right">
      <div class="clock">--:--:--</div>
    </div>
  </div>

  <!-- 날짜 선택 영역 -->
  <div class="date-section">
    <div class="date-nav">
      <button class="date-btn" onclick="changeDate(-1)">‹</button>
      <span class="date-display">--</span>
      <button class="date-btn" onclick="changeDate(1)">›</button>
      <span class="date-icon">📅</span>
    </div>
  </div>

  <!-- Kanban 보드 -->
  <div class="kanban-wrap">
    <h2 class="kanban-title">Tasks</h2>
    <button class="add-task-btn" onclick="showAddTaskModal()">+ Task 추가</button>
  </div>
  
  <div class="kanban">
    <div class="column" data-status="To-Do">
      <div class="column-title">To-Do</div>
    </div>
    <div class="column" data-status="In Progress">
      <div class="column-title">In Progress</div>
    </div>
    <div class="column" data-status="Done">
      <div class="column-title">Done</div>
    </div>
  </div>

  <!-- Schedules 섹션 -->
  <div class="schedules-section">
    <h2 class="schedules-title">📅 Schedules</h2>
    <div class="schedules-list"></div>
  </div>

  <!-- Clients 테이블 -->
  <div class="clients-section">
    <h2 class="clients-title">Clients</h2>
    <table class="clients-table">
      <thead>
        <tr>
          <th>Client</th>
          <th>Category</th>
          <th>Assignee</th>
          <th>KOL</th>
          <th>Community</th>
          <th>Risk</th>
          <th></th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- Task 추가 모달 -->
  <div class="modal" id="taskModal">
    <div class="modal-content">
      <h2 class="modal-title">Task 추가</h2>
      
      <div class="modal-group">
        <label class="modal-label">Task 이름 *</label>
        <input type="text" name="taskName" placeholder="할 일을 입력하세요">
      </div>

      <div class="modal-group">
        <label class="modal-label">Client</label>
        <input type="text" name="taskClient" placeholder="클라이언트 이름 (선택)">
      </div>

      <div class="modal-group">
        <label class="modal-label">Assignee</label>
        <input type="text" name="taskAssignee" placeholder="담당자 (선택)">
      </div>

      <div class="modal-group">
        <label class="modal-label">Status</label>
        <select name="taskStatus">
          <option value="To-Do">To-Do</option>
          <option value="In Progress">In Progress</option>
          <option value="Done">Done</option>
        </select>
      </div>

      <div class="modal-buttons">
        <button class="modal-btn submit" onclick="submitAddTask()">추가</button>
        <button class="modal-btn cancel" onclick="closeTaskModal()">취소</button>
      </div>
    </div>
  </div>

  <!-- 모달 외부 클릭으로 닫기 -->
  <script>
    document.getElementById('taskModal').addEventListener('click', (e) => {
      if (e.target.id === 'taskModal') closeTaskModal();
    });
  </script>

  <script src="./app.js"></script>
</body>
</html>
