<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bridge34 Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', 'Apple SD Gothic Neo', sans-serif;
      background: #0c0c1a;
      color: #e0e0f0;
      min-height: 100vh;
      padding: 28px 32px 60px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
    }

    .header-title {
      font-size: 2rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.5px;
    }

    .header-title span { color: #ff6633; }

    .clock {
      font-size: 1.8rem;
      font-weight: 300;
      color: #8888bb;
      font-variant-numeric: tabular-nums;
    }

    /* Kanban */
    .kanban-wrap { margin-bottom: 12px; }
    .kanban {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 20px;
    }

    .column {
      background: #14142a;
      border-radius: 16px;
      padding: 20px;
      min-height: 500px;
    }

    .column-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #aaa;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #2a2a3a;
    }

    .task-card {
      background: #1a1a2e;
      border-left: 3px solid #666;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
      cursor: grab;
      transition: all 0.2s;
    }

    .task-card.high { border-left-color: #ff4444; }
    .task-card.mid { border-left-color: #ffaa00; }

    .task-card:hover {
      background: #22223a;
      transform: translateY(-2px);
    }

    .task-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 8px;
    }

    .task-title {
      font-weight: 600;
      color: #fff;
      flex: 1;
    }

    .task-close {
      color: #888;
      cursor: pointer;
      font-size: 1.2rem;
      padding: 0 4px;
    }

    .task-close:hover { color: #ff6633; }

    .task-meta {
      font-size: 0.85rem;
      color: #888;
      display: flex;
      gap: 8px;
    }

    .task-client {
      background: #2a2a3a;
      padding: 2px 8px;
      border-radius: 4px;
    }

    .task-due {
      color: #ff9933;
    }

    .task-assignee {
      font-size: 0.8rem;
      color: #6699ff;
      margin-top: 6px;
    }

    /* Clients Table */
    .clients-section {
      margin-top: 40px;
    }

    .clients-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 16px;
      color: #fff;
    }

    .clients-table {
      width: 100%;
      border-collapse: collapse;
      background: #14142a;
      border-radius: 8px;
      overflow: hidden;
    }

    .clients-table thead {
      background: #1a1a2e;
    }

    .clients-table th {
      padding: 14px;
      text-align: left;
      font-weight: 600;
      color: #aaa;
      border-bottom: 1px solid #2a2a3a;
    }

    .clients-table td {
      padding: 12px 14px;
      border-bottom: 1px solid #2a2a3a;
      color: #ccc;
    }

    .clients-table tr:hover {
      background: #1a1a2e;
    }

    .risk-green { color: #44dd88; font-weight: 600; }
    .risk-yellow { color: #ffaa00; font-weight: 600; }
    .risk-red { color: #ff4444; font-weight: 600; }
    .risk-grey { color: #888; }

    .close-btn {
      color: #888;
      cursor: pointer;
      font-size: 1.1rem;
    }

    .close-btn:hover { color: #ff6633; }

    @media (max-width: 1400px) {
      .kanban { grid-template-columns: 1fr; }
      .clients-table { font-size: 0.9rem; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1 class="header-title"><span>Bridge34</span> Dashboard</h1>
    <div class="clock">--:--:--</div>
  </div>

  <div class="kanban-wrap">
    <div class="kanban">
      <div class="column" data-status="To-Do">
        <div class="column-title">To-Do</div>
      </div>
      <div class="column" data-status="In Progress">
        <div class="column-title">In Progress</div>
      </div>
      <div class="column" data-status="Done">
        <div class="column-title">Done</div>
      </div>
    </div>
  </div>

  <div class="clients-section">
    <h2 class="clients-title">Clients</h2>
    <table class="clients-table">
      <thead>
        <tr>
          <th>Client</th>
          <th>Category</th>
          <th>Assignee</th>
          <th>KOL</th>
          <th>Community</th>
          <th>Risk</th>
          <th></th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="./app.js"></script>
</body>
</html>
