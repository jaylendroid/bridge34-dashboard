<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FireAnt Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', 'Apple SD Gothic Neo', sans-serif;
      background: #0c0c1a;
      color: #e0e0f0;
      min-height: 100vh;
      padding: 28px 32px 60px;
    }

    /* ── Header ── */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
    }
    .header-title {
      font-size: 2rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.5px;
    }
    .header-title span { color: #ff6633; }
    .clock {
      font-size: 1.8rem;
      font-weight: 300;
      color: #8888bb;
      font-variant-numeric: tabular-nums;
    }

    /* ── Kanban ── */
    .kanban-wrap { margin-bottom: 12px; }
    .kanban {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 20px;
    }

    .column {
      background: #14142a;
      border-radius: 16px;
      padding: 18px;
      min-height: 320px;
    }
    .column-header {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 16px;
      padding: 8px 14px;
      border-radius: 10px;
      text-align: center;
      letter-spacing: 0.3px;
    }
    .col-todo   .column-header { background: #1e1e3e; color: #8899ff; border: 1px solid #2a2a5a; }
    .col-doing  .column-header { background: #1a2e1a; color: #66dd88; border: 1px solid #2a4a2a; }
    .col-done   .column-header { background: #1a1a1a; color: #888888; border: 1px solid #2a2a2a; }

    .card-count {
      display: inline-block;
      margin-left: 8px;
      font-size: 0.8rem;
      background: rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 1px 7px;
    }

    .card-list { min-height: 180px; }

    .card {
      background: #1e1e36;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 10px;
      cursor: grab;
      touch-action: none;
      transition: box-shadow 0.15s, transform 0.15s;
      border-left: 4px solid #3333aa;
      user-select: none;
    }
    .card:active { cursor: grabbing; }
    .card.sortable-chosen { transform: scale(1.02); box-shadow: 0 12px 32px rgba(0,0,0,0.6); z-index: 99; }
    .card.sortable-ghost { opacity: 0.25; }
    .col-doing .card { border-left-color: #44aa66; }
    .col-done  .card { border-left-color: #444; opacity: 0.75; }

    .card-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: #f0f0ff;
      margin-bottom: 9px;
      line-height: 1.4;
    }
    .card-meta {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }
    .badge {
      font-size: 0.72rem;
      padding: 3px 8px;
      border-radius: 20px;
      font-weight: 600;
      white-space: nowrap;
    }
    .badge-client   { background: #22224a; color: #9999ff; }
    .badge-assignee { background: #1a2e1a; color: #77cc88; }
    .badge-due      { background: #2e1a1a; color: #cc8877; }
    .badge-high     { background: #3a1010; color: #ff5555; }
    .badge-mid      { background: #2a2a10; color: #bbbb44; }

    .empty-col {
      color: #333355;
      text-align: center;
      padding: 32px 0;
      font-size: 0.9rem;
    }

    /* ── Scroll hint ── */
    .scroll-hint {
      text-align: center;
      color: #33334a;
      font-size: 0.85rem;
      margin: 20px 0 40px;
      letter-spacing: 1px;
      animation: pulse 3s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:.3} 50%{opacity:.8} }

    /* ── Clients section ── */
    .section-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: #8888bb;
      margin-bottom: 18px;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-size: 0.9rem;
      border-top: 1px solid #1a1a2a;
      padding-top: 40px;
    }

    .client-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
      margin-bottom: 48px;
    }

    .client-card {
      background: #14142a;
      border-radius: 12px;
      padding: 16px 18px;
      border: 1px solid #1e1e3a;
      transition: border-color 0.2s;
    }
    .client-card:hover { border-color: #3333aa; }

    .client-name {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .risk-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .risk-green  { background: #44dd44; box-shadow: 0 0 6px #44dd44; }
    .risk-yellow { background: #dddd44; box-shadow: 0 0 6px #dddd44; }
    .risk-red    { background: #dd4444; box-shadow: 0 0 6px #dd4444; }
    .risk-gray   { background: #555; }

    .client-meta {
      font-size: 0.82rem;
      color: #6666aa;
      line-height: 1.8;
    }
    .client-meta .highlight { color: #9999cc; }

    .cat-badge {
      display: inline-block;
      font-size: 0.7rem;
      padding: 2px 7px;
      border-radius: 10px;
      font-weight: 600;
      margin-left: 4px;
    }
    .cat-active     { background: #1a2e1a; color: #66dd88; }
    .cat-discussion { background: #2a2a1a; color: #cccc66; }
    .cat-hold       { background: #2a1a1a; color: #cc6666; }

    /* ── Events ── */
    .events-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 40px;
    }
    .events-panel {
      background: #14142a;
      border-radius: 16px;
      padding: 18px 20px;
    }
    .events-header {
      font-size: 0.85rem;
      font-weight: 700;
      color: #6666aa;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 14px;
    }
    .event-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid #1a1a2e;
    }
    .event-item:last-child { border-bottom: none; }
    .event-time {
      font-size: 0.82rem;
      color: #ff6633;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      min-width: 42px;
      padding-top: 1px;
    }
    .event-time.allday { color: #5555aa; }
    .event-title {
      font-size: 0.92rem;
      color: #e0e0f0;
      flex: 1;
      line-height: 1.4;
    }
    .event-meet {
      font-size: 0.75rem;
      color: #4488ff;
      text-decoration: none;
      white-space: nowrap;
      padding-top: 2px;
    }
    .event-meet:hover { color: #88bbff; }
    .event-empty { color: #333355; font-size: 0.85rem; padding: 10px 0; }
    .event-loading { color: #333355; font-size: 0.85rem; padding: 10px 0; animation: pulse 2s infinite; }

    /* ── Sync bar ── */
    .sync-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #0a0a14;
      border-top: 1px solid #1a1a2a;
      padding: 7px 32px;
      font-size: 0.78rem;
      color: #333355;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }
    .sync-bar .ok   { color: #448844; }
    .sync-bar .fail { color: #aa4444; }
  </style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-title">🔥 <span>Fire</span>Ant</div>
  <div class="clock" id="clock">--:--</div>
</div>

<!-- KANBAN -->
<div class="kanban-wrap">
  <div class="kanban">
    <div class="column col-todo">
      <div class="column-header">📋 할 일 <span class="card-count" id="cnt-todo">0</span></div>
      <div class="card-list" id="col-todo"></div>
    </div>
    <div class="column col-doing">
      <div class="column-header">⚡ 진행 중 <span class="card-count" id="cnt-doing">0</span></div>
      <div class="card-list" id="col-doing"></div>
    </div>
    <div class="column col-done">
      <div class="column-header">✅ 완료 <span class="card-count" id="cnt-done">0</span></div>
      <div class="card-list" id="col-done"></div>
    </div>
  </div>
</div>

<div class="scroll-hint">↓ 스크롤 — 일정 및 클라이언트 현황</div>

<!-- EVENTS -->
<div class="events-row">
  <div class="events-panel">
    <div class="events-header">📅 오늘 일정</div>
    <div id="events-today"><div class="event-loading">불러오는 중...</div></div>
  </div>
  <div class="events-panel">
    <div class="events-header">📅 내일 일정</div>
    <div id="events-tomorrow"><div class="event-loading">불러오는 중...</div></div>
  </div>
</div>

<!-- CLIENTS -->
<div class="section-title">📊 전체 클라이언트 현황</div>
<div class="client-grid" id="client-grid">
  <div style="color:#333355;padding:20px">불러오는 중...</div>
</div>

<!-- SYNC BAR -->
<div class="sync-bar">
  <span id="sync-status">연결 중...</span>
  <span>🔄 30초 자동 새로고침</span>
</div>

<script>
// ── Clock ──
function tick() {
  const now = new Date();
  document.getElementById('clock').textContent =
    now.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}
setInterval(tick, 1000);
tick();

// ── Helpers ──
function badge(cls, text) {
  return `<span class="badge ${cls}">${text}</span>`;
}
function priorityBadge(p) {
  if (!p) return '';
  const v = String(p).toLowerCase();
  if (v === 'high' || v === '높음') return badge('badge-high', '🔴 긴급');
  if (v === 'mid'  || v === '중간') return badge('badge-mid',  '🟡 보통');
  return '';
}
function riskDot(r) {
  const v = String(r || '').toLowerCase().trim();
  if (v === 'green'  || v === '🟢' || v === 'good')  return '<span class="risk-dot risk-green"></span>';
  if (v === 'yellow' || v === '🟡' || v === 'watch') return '<span class="risk-dot risk-yellow"></span>';
  if (v === 'red'    || v === '🔴' || v === 'risk')  return '<span class="risk-dot risk-red"></span>';
  return '<span class="risk-dot risk-gray"></span>';
}
function catBadge(cat) {
  const v = String(cat || '').toLowerCase();
  if (v.includes('진행') || v.includes('active'))    return `<span class="cat-badge cat-active">진행중</span>`;
  if (v.includes('논의') || v.includes('discuss'))   return `<span class="cat-badge cat-discussion">논의중</span>`;
  if (v.includes('중단') || v.includes('hold'))      return `<span class="cat-badge cat-hold">중단</span>`;
  return '';
}

// ── Render Tasks ──
function renderTasks(tasks) {
  if (!tasks || tasks.error) { setSyncStatus('태스크 로드 실패 ⚠️', false); return; }

  const todo  = tasks.filter(t => !t['Status'] || t['Status'] === 'To-Do'      || t['Status'] === '할 일');
  const doing = tasks.filter(t =>  t['Status'] === 'In Progress' || t['Status'] === '진행 중');
  const done  = tasks.filter(t =>  t['Status'] === 'Done'        || t['Status'] === '완료');

  document.getElementById('cnt-todo').textContent  = todo.length;
  document.getElementById('cnt-doing').textContent = doing.length;
  document.getElementById('cnt-done').textContent  = done.length;

  renderCol('col-todo',  todo);
  renderCol('col-doing', doing);
  renderCol('col-done',  done);

  initSortable();
  setSyncStatus(`마지막 동기화: ${new Date().toLocaleTimeString('ko-KR')}`, true);
}

function renderCol(colId, items) {
  const el = document.getElementById(colId);
  if (items.length === 0) {
    el.innerHTML = '<div class="empty-col">—</div>';
    return;
  }
  el.innerHTML = items.map(t => {
    const due      = t['Due Date'] ? badge('badge-due',      `📅 ${t['Due Date']}`) : '';
    const assignee = t['Assignee'] ? badge('badge-assignee', `👤 ${t['Assignee']}`) : '';
    const client   = t['Client']   ? badge('badge-client',   `🏷 ${t['Client']}`)   : '';
    const prio     = priorityBadge(t['Priority']);
    return `
      <div class="card" data-row="${t._row}" data-status="${t['Status'] || 'To-Do'}">
        <div class="card-title">${t['Task'] || ''}</div>
        <div class="card-meta">${client}${assignee}${due}${prio}</div>
      </div>`;
  }).join('');
}

// ── Drag & Drop ──
const STATUS_MAP = { 'col-todo': 'To-Do', 'col-doing': 'In Progress', 'col-done': 'Done' };

function initSortable() {
  ['col-todo', 'col-doing', 'col-done'].forEach(id => {
    const el = document.getElementById(id);
    if (el._sortable) { el._sortable.destroy(); }
    el._sortable = Sortable.create(el, {
      group: 'kanban',
      animation: 180,
      ghostClass: 'sortable-ghost',
      chosenClass: 'sortable-chosen',
      delay: 80,           // 터치 드래그 딜레이 (오터치 방지)
      delayOnTouchOnly: true,
      onEnd(evt) {
        const card      = evt.item;
        const newStatus = STATUS_MAP[evt.to.id];
        const oldStatus = card.dataset.status;
        if (oldStatus === newStatus) return;
        card.dataset.status = newStatus;
        // 카운터 업데이트
        refreshCounters();
        setSyncStatus('저장 중...', null);
        google.script.run
          .withSuccessHandler(() => setSyncStatus(`저장됨 ✓ ${new Date().toLocaleTimeString('ko-KR')}`, true))
          .withFailureHandler(() => setSyncStatus('저장 실패 ⚠️', false))
          .updateTaskStatus(parseInt(card.dataset.row), newStatus);
      }
    });
  });
}

function refreshCounters() {
  document.getElementById('cnt-todo').textContent  = document.getElementById('col-todo').querySelectorAll('.card').length;
  document.getElementById('cnt-doing').textContent = document.getElementById('col-doing').querySelectorAll('.card').length;
  document.getElementById('cnt-done').textContent  = document.getElementById('col-done').querySelectorAll('.card').length;
}

// ── Render Clients ──
function renderClients(clients) {
  const grid = document.getElementById('client-grid');
  if (!clients || clients.length === 0) {
    grid.innerHTML = '<div style="color:#333355;padding:20px">클라이언트 데이터 없음</div>';
    return;
  }
  grid.innerHTML = clients.map(c => `
    <div class="client-card">
      <div class="client-name">
        ${riskDot(c['Risk'])}
        ${c['Client']}
        ${catBadge(c['Category'])}
      </div>
      <div class="client-meta">
        <span class="highlight">👤 ${c['Assignee'] || '—'}</span>
        ${c['KOL']       ? `&nbsp;·&nbsp; 📢 KOL: ${c['KOL']}`             : ''}
        ${c['Community'] ? `<br>💬 커뮤니티: ${c['Community']}`             : ''}
        ${c['Next Action'] ? `<br>→ <span class="highlight">${c['Next Action']}</span>` : ''}
        ${c['Notes']     ? `<br><span style="color:#444466">${c['Notes']}</span>` : ''}
      </div>
    </div>`
  ).join('');
}

// ── Sync Status ──
function setSyncStatus(msg, ok) {
  const el = document.getElementById('sync-status');
  el.textContent = msg;
  el.className = ok === true ? 'ok' : ok === false ? 'fail' : '';
}

// ── Render Events ──
function renderEvents(data) {
  if (!data) return;
  renderEventList('events-today',    data.today    || []);
  renderEventList('events-tomorrow', data.tomorrow || []);
}

function renderEventList(elId, events) {
  const el = document.getElementById(elId);
  if (!events.length) {
    el.innerHTML = '<div class="event-empty">일정 없음</div>';
    return;
  }
  el.innerHTML = events.map(ev => {
    const timeClass = ev.allDay ? 'event-time allday' : 'event-time';
    const meetHtml  = ev.meetLink
      ? `<a class="event-meet" href="${ev.meetLink}" target="_blank">🔗 Meet</a>`
      : '';
    return `<div class="event-item">
      <span class="${timeClass}">${ev.time}</span>
      <span class="event-title">${ev.title}</span>
      ${meetHtml}
    </div>`;
  }).join('');
}

// ── Load & Auto-refresh ──
function loadAll() {
  google.script.run
    .withSuccessHandler(renderTasks)
    .withFailureHandler(() => setSyncStatus('태스크 로드 실패 ⚠️', false))
    .getTasks();
  google.script.run
    .withSuccessHandler(renderClients)
    .withFailureHandler(() => {})
    .getClients();
  google.script.run
    .withSuccessHandler(renderEvents)
    .withFailureHandler(() => {})
    .getEvents();
}

loadAll();
setInterval(loadAll, 30000);
</script>
</body>
</html>
