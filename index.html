<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bridge34 Dashboard TV</title>
  <style>
    :root {
      --bg: #0a0a1a;
      --panel-bg: #0f0f22;
      --header-bg: #12122a;
      --text: #e0e0f0;
      --muted: #9a9ab4;
      --accent: #ff6633;
      --line: #1e1e3a;
      --green: #00c97a;
      --yellow: #f5a623;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    }

    .wrapper {
      display: grid;
      grid-template-rows: 60px 1fr;
      height: 100vh;
      width: 100vw;
    }

    .header {
      display: grid;
      grid-template-columns: 1fr auto auto auto;
      align-items: center;
      gap: 18px;
      background: var(--header-bg);
      border-bottom: 1px solid var(--line);
      padding: 0 20px;
      min-height: 60px;
    }

    .logo { font-size: 2rem; font-weight: 800; color: var(--accent); }
    .date { font-size: 1.05rem; color: var(--text); }
    .clock { font-size: 1.05rem; font-variant-numeric: tabular-nums; }
    .refresh-hint { font-size: 0.9rem; color: var(--muted); }

    .content {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 0;
      height: calc(100vh - 60px);
      overflow: hidden;
    }

    .panel {
      background: var(--panel-bg);
      overflow-y: auto;
      padding: 16px 18px;
      border-right: 1px solid var(--line);
      min-height: 0;
    }

    .panel:last-child { border-right: none; }

    .panel-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 1.4rem;
      font-weight: 700;
    }

    .badge {
      font-size: 0.8rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      color: #081117;
    }

    .badge.green { background: var(--green); }
    .badge.yellow { background: var(--yellow); color: #211400; }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 0.9rem;
    }

    thead th {
      text-align: left;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
      padding: 6px 8px;
      position: sticky;
      top: 0;
      background: var(--panel-bg);
      z-index: 1;
      font-weight: 700;
    }

    tbody td {
      border-bottom: 1px solid #181832;
      padding: 6px 8px;
      vertical-align: middle;
      font-size: 0.9rem;
      line-height: 1.2;
      word-break: break-word;
    }

    .table-wrap {
      overflow-y: auto;
      max-height: calc(100vh - 120px);
    }

    .cell-input {
      width: 100%;
      border: 1px solid #27274d;
      border-radius: 6px;
      background: #111130;
      color: var(--text);
      padding: 4px 6px;
      font-size: 0.88rem;
    }

    .todo-groups {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .todo-group {
      border: 1px solid #242447;
      border-radius: 10px;
      padding: 10px;
      background: #12122d;
    }

    .todo-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .todo-name { font-weight: 700; font-size: 1.05rem; }
    .todo-rate { color: var(--muted); font-size: 0.9rem; }

    .progress {
      width: 100%;
      height: 8px;
      border-radius: 999px;
      background: #23234a;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #ff6633, #00c97a);
    }

    .todo-item {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      font-size: 1.0rem;
      margin: 4px 0;
    }

    .todo-item.done {
      opacity: 0.45;
      text-decoration: line-through;
    }

    .empty { color: var(--muted); font-size: 1rem; padding: 8px 2px; }

    .deal-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .deal-card {
      border: 1px solid #373022;
      background: #1a1620;
      border-radius: 10px;
      padding: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 1.05rem;
    }

    .deal-tag {
      font-size: 0.8rem;
      padding: 2px 7px;
      border-radius: 999px;
      background: #f5a623;
      color: #2a1a00;
      font-weight: 700;
    }

    .modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.55);
    }

    .modal-content {
      width: min(560px, 92vw);
      background: #12122d;
      border: 1px solid #30305a;
      border-radius: 12px;
      padding: 16px;
    }

    .modal-title { font-size: 1.2rem; font-weight: 800; margin-bottom: 10px; }
    .modal-row { margin: 8px 0; color: #d7d7e8; }
    .modal-close {
      margin-top: 12px;
      border: 1px solid #3d3d70;
      background: #19193a;
      color: var(--text);
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <header class="header">
      <div class="logo">🔶 Bridge34</div>
      <div class="date" id="date">----.--.-- (-)</div>
      <div class="clock" id="clock">--:--:-- KST</div>
      <div class="refresh-hint">↻ 30초마다</div>
    </header>

    <main class="content">
      <section class="panel">
        <div class="panel-title">📋 협업 프로젝트 현황 <span class="badge green">진행중</span></div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th style="width: 10%">#</th>
                <th style="width: 28%">프로젝트명</th>
                <th style="width: 31%">일정</th>
                <th style="width: 31%">계약 서비스</th>
              </tr>
            </thead>
            <tbody id="projectsBody"></tbody>
          </table>
        </div>
      </section>

      <section class="panel">
        <div class="panel-title">👤 직원별 To-Do</div>
        <div id="todoGroups" class="todo-groups"></div>
      </section>

      <section class="panel">
        <div class="panel-title">🤝 미확정 딜 <span class="badge yellow" id="dealCountBadge">0</span></div>
        <div id="dealList" class="deal-list"></div>
      </section>
    </main>
  </div>

  <div id="dealModal" class="modal" onclick="if(event.target===this) closeDealModal()">
    <div class="modal-content">
      <div id="dealModalTitle" class="modal-title"></div>
      <div class="modal-row" id="dealModalNextAction"></div>
      <div class="modal-row" id="dealModalNotes"></div>
      <button class="modal-close" onclick="closeDealModal()">닫기</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
