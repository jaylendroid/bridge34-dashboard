<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bridge34 Dashboard TV</title>
  <style>
    :root {
      --bg: #0a0a1a;
      --panel-bg: #0f0f22;
      --header-bg: #12122a;
      --text: #e0e0f0;
      --muted: #9a9ab4;
      --line: #1e1e3a;
      --green: #00c97a;
      --yellow: #f5a623;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    }

    .wrapper {
      display: grid;
      grid-template-rows: 60px 1fr;
      height: 100vh;
      width: 100vw;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--header-bg);
      border-bottom: 1px solid var(--line);
      padding: 0 20px;
      height: 60px;
    }

    .logo { font-size: 1.6rem; font-weight: 800; color: var(--text); }
    .header-right { font-size: 1.05rem; color: var(--text); font-variant-numeric: tabular-nums; }

    .content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      height: calc(100vh - 60px);
      overflow: hidden;
    }

    .left-col {
      display: grid;
      grid-template-rows: 4fr 1fr;
      overflow: hidden;
      border-right: 1px solid var(--line);
      min-height: 0;
    }

    .right-col {
      display: grid;
      grid-template-rows: 1fr 1fr;
      overflow: hidden;
      min-height: 0;
    }

    .panel {
      background: var(--panel-bg);
      padding: 12px 14px;
      min-height: 0;
      overflow: hidden;
      border-bottom: 1px solid var(--line);
    }

    .left-col .panel:last-child,
    .right-col .panel:last-child {
      border-bottom: none;
    }

    .panel-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      font-size: 1.08rem;
      font-weight: 700;
      min-height: 28px;
    }

    .badge {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      color: #081117;
    }

    .badge.green { background: var(--green); }
    .badge.yellow { background: var(--yellow); color: #211400; }

    .table-wrap {
      overflow-y: auto;
      height: calc(100% - 40px);
      border: 1px solid #1a1a2e;
      border-radius: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 0.9rem;
    }

    thead th {
      text-align: left;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
      padding: 6px 8px;
      position: sticky;
      top: 0;
      background: var(--panel-bg);
      z-index: 1;
      font-weight: 700;
    }

    tbody td {
      border-bottom: 1px solid #181832;
      padding: 6px 8px;
      font-size: 0.9rem;
      line-height: 1.2;
      word-break: break-word;
      vertical-align: middle;
    }

    .cell-input {
      width: 100%;
      border: 1px solid #27274d;
      border-radius: 6px;
      background: #111130;
      color: var(--text);
      padding: 4px 6px;
      font-size: 0.84rem;
    }

    .deal-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 4px;
      align-content: start;
      height: calc(100% - 40px);
      overflow: hidden;
    }

    .deal-grid .deal-card {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 6px;
      padding: 4px 6px;
      font-size: 0.72rem;
      color: #e0e0f0;
      cursor: pointer;
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-height: 24px;
    }

    .deal-grid .deal-card:hover { background: #222244; }

    .schedule-list {
      overflow-y: auto;
      height: calc(100% - 40px);
      border: 1px solid #1a1a2e;
      border-radius: 8px;
      padding: 2px 6px;
    }

    .schedule-item {
      display: flex;
      gap: 10px;
      padding: 6px 4px;
      border-bottom: 1px solid #1a1a2e;
      font-size: 0.88rem;
    }

    .schedule-item:last-child { border-bottom: none; }

    .sch-time {
      color: #ff6633;
      font-weight: 700;
      min-width: 40px;
      font-family: monospace;
    }

    .sch-title {
      color: #e0e0f0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .empty { color: var(--muted); font-size: 0.92rem; padding: 8px 4px; }

    .modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.55);
    }

    .modal-content {
      width: min(420px, 90vw);
      background: #12122d;
      border: 1px solid #30305a;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }

    .modal-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 12px; }

    .modal-close {
      border: 1px solid #3d3d70;
      background: #19193a;
      color: var(--text);
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <header class="header">
      <div class="logo">Bridge34 Office Board</div>
      <div class="header-right" id="headerRight">--:--:-- KST ↻ 30s</div>
    </header>

    <main class="content">
      <div class="left-col">
        <section class="panel panel-projects">
          <div class="panel-title">📋 협업 프로젝트 현황 <span class="badge green">진행중</span></div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th style="width:8%">#</th>
                  <th style="width:26%">프로젝트명</th>
                  <th style="width:17%">기준일</th>
                  <th style="width:49%">서비스</th>
                </tr>
              </thead>
              <tbody id="projectsBody"></tbody>
            </table>
          </div>
        </section>

        <section class="panel panel-deals">
          <div class="panel-title">🤝 미확정 딜 <span class="badge yellow" id="dealCountBadge">0</span></div>
          <div id="dealList" class="deal-grid"></div>
        </section>
      </div>

      <div class="right-col">
        <section class="panel">
          <div class="panel-title" id="todayTitle">📅 오늘</div>
          <div id="todayList" class="schedule-list"></div>
        </section>

        <section class="panel">
          <div class="panel-title" id="tomorrowTitle">📅 내일</div>
          <div id="tomorrowList" class="schedule-list"></div>
        </section>
      </div>
    </main>
  </div>

  <div id="dealModal" class="modal" onclick="if(event.target===this) closeDealModal()">
    <div class="modal-content">
      <div id="dealModalTitle" class="modal-title"></div>
      <button class="modal-close" onclick="closeDealModal()">닫기</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
