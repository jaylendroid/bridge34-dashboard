<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bridge34 Office Dashboard</title>
  <style>
    :root {
      --bg: #090d17;
      --panel: #111827;
      --panel-2: #0f172a;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --line: #1f2937;
      --green: #22c55e;
      --yellow: #facc15;
      --orange: #fb923c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', sans-serif;
      background: radial-gradient(circle at top, #10172b, var(--bg));
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 18px;
      gap: 14px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(17, 24, 39, 0.75);
    }
    .logo { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.02em; }
    .logo span { color: var(--orange); }
    .clock-wrap { color: var(--muted); text-align: right; }
    #clock { font-size: 1.25rem; color: #fff; font-variant-numeric: tabular-nums; }

    .dashboard {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 14px;
      height: calc(100vh - 110px);
    }
    .left-panel { grid-column: 1; grid-row: 1 / span 2; }
    .right-top { grid-column: 2; grid-row: 1; }
    .right-bottom { grid-column: 2; grid-row: 2; }

    .panel {
      background: rgba(17, 24, 39, 0.92);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .panel h2 { font-size: 1.05rem; margin-bottom: 12px; }
    .muted { color: var(--muted); font-size: 0.85rem; }
    .badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      border-radius: 999px;
      padding: 3px 8px;
      margin-left: 8px;
      color: #0b1020;
      background: #cbd5e1;
    }
    .badge.green { background: var(--green); }
    .badge.yellow { background: var(--yellow); }

    table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
    thead th {
      color: var(--muted);
      font-weight: 600;
      text-align: left;
      border-bottom: 1px solid var(--line);
      padding: 10px 8px;
      position: sticky;
      top: 0;
      background: var(--panel);
    }
    tbody td {
      border-bottom: 1px solid #1b2538;
      padding: 10px 8px;
      vertical-align: top;
    }
    .projects-wrap { overflow: auto; }
    .editable {
      background: #0b1220;
      border: 1px solid #263248;
      color: #dbe5f5;
      border-radius: 8px;
      padding: 6px 8px;
      width: 100%;
      font-size: 0.86rem;
    }
    .save-btn {
      margin-top: 6px;
      border: 1px solid #3a4a65;
      color: #c8d6f1;
      background: #14213a;
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .todo-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      min-height: 0;
      overflow: auto;
    }
    .todo-card {
      border: 1px solid #263248;
      background: var(--panel-2);
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .todo-title { font-weight: 700; }
    .progress {
      width: 100%; height: 8px; border-radius: 999px; background: #1f2937; overflow: hidden;
    }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #4ade80, #22c55e); }
    .todo-item {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      font-size: 0.88rem;
      color: #dbe5f5;
    }

    .deals-wrap {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
      overflow: auto;
    }
    .deal-card {
      border: 1px solid #3f3620;
      background: #1d1a12;
      border-radius: 10px;
      padding: 10px;
      cursor: pointer;
    }
    .deal-card:hover { outline: 1px solid #d7b94a; }

    .modal {
      position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
      background: rgba(2, 6, 23, 0.6);
    }
    .modal-content {
      width: min(520px, 92vw); background: #0f172a; border: 1px solid #334155;
      border-radius: 12px; padding: 16px;
    }
    .modal-content h3 { margin-bottom: 10px; }
    .modal-close { margin-top: 12px; padding: 7px 10px; cursor: pointer; }

    #schedules-container {
      background: #1a1a2e;
      border-radius: 8px;
      padding: 15px;
      min-height: 200px;
    }

    #schedules-list {
      max-height: 400px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="logo">Bridge<span>34</span> Office Board</div>
    <div class="clock-wrap">
      <div id="clock">--:--:--</div>
      <div class="muted">Asia/Seoul · 자동 새로고침 30초</div>
    </div>
  </header>

  <main class="dashboard">
    <section class="panel left-panel">
      <h2>📋 협업 프로젝트 현황 <span class="badge green">진행중</span></h2>
      <div class="projects-wrap">
        <table>
          <thead>
            <tr>
              <th style="width: 28%">프로젝트명</th>
              <th style="width: 22%">중요도</th>
              <th>계약 서비스</th>
            </tr>
          </thead>
          <tbody id="projectsBody"></tbody>
        </table>
      </div>
    </section>

    <section class="panel right-top">
      <h2>👤 직원별 To-Do</h2>
      <div id="todoGrid" class="todo-grid"></div>
    </section>

    <section class="panel right-bottom">
      <h2>🤝 미확정 딜 <span class="badge yellow">논의중</span></h2>
      <div id="dealsWrap" class="deals-wrap"></div>
    </section>
  </main>

  <section class="panel" style="margin-top: 14px;">
    <h2>📅 일정 <span class="badge green">실시간</span></h2>
    <div id="schedules-container">
      <div id="schedules-list"></div>
      <div id="schedules-loading">로딩 중...</div>
      <div id="schedules-error" style="color: #ff6b6b;"></div>
    </div>
  </section>

  <div id="dealModal" class="modal" onclick="if(event.target===this) closeDealModal()">
    <div class="modal-content">
      <h3 id="dealTitle"></h3>
      <div id="dealBody" class="muted"></div>
      <button class="modal-close" onclick="closeDealModal()">닫기</button>
    </div>
  </div>

  <script>
    async function loadCalendarEvents() {
      try {
        // Supabase에서 events 조회
        const response = await fetch(
          'https://npdzxtnzjkdzwbpphduf.supabase.co/rest/v1/events?' +
          'order=start_time.asc&limit=20',
          {
            headers: {
              'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5wZHp4dG56amtkendicHBoZHVmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ1OTMzODEsImV4cCI6MjA5MDE2OTM4MX0.w4xorz_-pesk82jodGqPzGtPJup3qQ173iGhF-W1mFE',
              'Content-Type': 'application/json',
            }
          }
        );
        
        if (!response.ok) throw new Error(`API error: ${response.status}`);
        
        const events = await response.json();
        
        // HTML로 렌더링
        const listDiv = document.getElementById('schedules-list');
        
        if (events.length === 0) {
          listDiv.innerHTML = '<p style="color: #999;">일정이 없습니다</p>';
          return;
        }
        
        listDiv.innerHTML = events.map(event => {
          const start = new Date(event.start_time);
          const time = start.toLocaleTimeString('ko-KR', {hour: '2-digit', minute: '2-digit'});
          
          return `
            <div style="padding: 10px; border-bottom: 1px solid #333;">
              <div style="font-weight: bold;">${event.summary}</div>
              <div style="font-size: 0.9em; color: #999;">${time}</div>
              ${event.meet_link ? `<a href="${event.meet_link}" target="_blank" style="color: #4a90e2;">📹 Meet 참여</a>` : ''}
            </div>
          `;
        }).join('');
        
      } catch (error) {
        document.getElementById('schedules-error').textContent = `오류: ${error.message}`;
      } finally {
        document.getElementById('schedules-loading').style.display = 'none';
      }
    }

    // 페이지 로드 시 실행
    document.addEventListener('DOMContentLoaded', loadCalendarEvents);
  </script>

  <script src="app.js"></script>
</body>
</html>
