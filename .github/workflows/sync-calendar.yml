name: Sync Google Calendar to Supabase

# 트리거: 1시간마다 실행
on:
  schedule:
    # 매 시간 00분에 실행 (UTC 기준)
    - cron: '0 * * * *'
  # 수동 트리거 (Actions 탭에서)
  workflow_dispatch:

jobs:
  sync-calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 1. 저장소 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Node.js 환경 설정 (LTS 버전)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'

      # 3. 의존성 설치
      - name: Install dependencies
        run: npm install

      # 4. 동기화 스크립트 실행
      - name: Sync Calendar
        run: node scripts/sync-calendar.js
        env:
          GOOGLE_CALENDAR_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_CALENDAR_SERVICE_ACCOUNT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}

      # 5. 실패 시 알림 (선택사항)
      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Calendar sync failed!"
          echo "Check: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
