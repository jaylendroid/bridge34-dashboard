name: Sync Google Calendar to Supabase

on:
  schedule:
    # UTC 기준 매 시간 00분에 실행
    # 한국시간(UTC+9)으로는 9시간 뒤
    - cron: '0 * * * *'
  
  # 수동 실행 가능
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install gog CLI
        run: npm install -g gog
      
      - name: Install dependencies
        run: npm install
      
      - name: Configure gog auth
        run: |
          # GitHub Actions의 기본 인증을 사용
          # (로컬 gog auth는 GitHub Actions에서 자동으로 사용됨)
          gog auth list
      
      - name: Run sync script
        run: node scripts/sync-calendar.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
      
      - name: Log sync completion
        if: always()
        run: echo "Calendar sync completed at $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
